<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
        }
        #user-info {
            position: absolute;
            top: 10px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #70c5ce;
        }
    </style>
</head>
<body>

    <div id="user-info">Xin chào, <span id="username">Bạn</span>! 🎮</div>
    
    <div id="game-container">
        <canvas id="birdCanvas"></canvas>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        const canvas = document.getElementById('birdCanvas');
        const ctx = canvas.getContext('2d');

        // Thiết lập kích thước khung hiển thị chuẩn tỷ lệ dọc cho game
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 700;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // Tạo hình ảnh chú chim SVG
        const birdImg = new Image();
        birdImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 30"><ellipse cx="20" cy="15" rx="18" ry="13" fill="%23f7d51d" stroke="%23000" stroke-width="2"/><ellipse cx="12" cy="17" rx="7" ry="5" fill="%23fff" stroke="%23000" stroke-width="1.5"/><circle cx="28" cy="10" r="5" fill="%23fff" stroke="%23000" stroke-width="1.5"/><circle cx="29" cy="10" r="2" fill="%23000"/><path d="M 32 14 Q 40 16 33 20 Z" fill="%23e74c3c" stroke="%23000" stroke-width="1.5"/></svg>';

        let birdX = 90;
        let birdY = 300;
        let birdRadius = 18;
        let gravity = 0.25;
        let velocity = 0;
        let jump = -5.2;
        let score = 0;
        let gameOver = false;

        let pipes = [];
        let pipeWidth = 65;
        let pipeGap = 160;
        let pipeSpeed = 2.2;

        function createPipe() {
            let topHeight = Math.floor(Math.random() * (CANVAS_HEIGHT - pipeGap - 200)) + 60;
            pipes.push({
                x: CANVAS_WIDTH,
                top: topHeight,
                bottom: CANVAS_HEIGHT - topHeight - pipeGap,
                passed: false
            });
        }

        function handleInput() {
            if (gameOver) {
                resetGame();
            } else {
                velocity = jump;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handleInput();
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        }, { passive: false });
        canvas.addEventListener('mousedown', handleInput);

        function resetGame() {
            birdY = 300;
            velocity = 0;
            pipes = [];
            score = 0;
            gameOver = false;
            createPipe();
            loop();
        }

        function update() {
            if (gameOver) return;

            velocity += gravity;
            birdY += velocity;

            // Va chạm sàn hoặc trần
            if (birdY + birdRadius >= CANVAS_HEIGHT - 40 || birdY - birdRadius <= 0) {
                gameOver = true;
            }

            if (pipes.length === 0 || pipes[pipes.length - 1].x < CANVAS_WIDTH - 200) {
                createPipe();
            }

            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                p.x -= pipeSpeed;

                // Va chạm ống nước
                if (
                    birdX + birdRadius > p.x && 
                    birdX - birdRadius < p.x + pipeWidth && 
                    (birdY - birdRadius < p.top || birdY + birdRadius > CANVAS_HEIGHT - p.bottom)
                ) {
                    gameOver = true;
                }

                // Tính điểm
                if (!p.passed && p.x + pipeWidth < birdX) {
                    p.passed = true;
                    score++;
                }
            }

            if (pipes.length > 0 && pipes[0].x < -pipeWidth) {
                pipes.shift();
            }
        }

        function drawBackground() {
            // Nền trời
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Mây trang trí
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            ctx.beginPath();
            ctx.arc(80, 120, 25, 0, Math.PI * 2);
            ctx.arc(110, 105, 35, 0, Math.PI * 2);
            ctx.arc(140, 120, 25, 0, Math.PI * 2);
            ctx.fill();

            // Đất cỏ phía dưới
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, CANVAS_HEIGHT - 40, CANVAS_WIDTH, 40);
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(0, CANVAS_HEIGHT - 40, CANVAS_WIDTH, 12);
        }

        function draw() {
            drawBackground();

            // Vẽ các cột
            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];

                // Cột trên
                ctx.fillStyle = "#73bf2e";
                ctx.fillRect(p.x, 0, pipeWidth, p.top);
                ctx.strokeStyle = "#53801b";
                ctx.lineWidth = 4;
                ctx.strokeRect(p.x, 0, pipeWidth, p.top);

                // Cột dưới
                ctx.fillRect(p.x, CANVAS_HEIGHT - p.bottom, pipeWidth, p.bottom);
                ctx.strokeRect(p.x, CANVAS_HEIGHT - p.bottom, pipeWidth, p.bottom);
            }

            // Vẽ chim
            ctx.save();
            ctx.translate(birdX, birdY);
            let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, velocity * 0.07));
            ctx.rotate(angle);
            ctx.drawImage(birdImg, -24, -18, 48, 36);
            ctx.restore();

            // Điểm số
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 4;
            ctx.font = "bold 36px sans-serif";
            ctx.strokeText("Điểm: " + score, 20, 60);
            ctx.fillText("Điểm: " + score, 20, 60);

            // Màn hình Game Over
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 38px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 20);

                ctx.font = "20px sans-serif";
                ctx.fillText("Chạm để chơi lại", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 30);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        createPipe();
        loop();
    </script>
</body>
</html>
