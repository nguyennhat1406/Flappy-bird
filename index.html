<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #user-info {
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 600;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #70c5ce;
        }
    </style>
</head>
<body>

    <div id="user-info">Xin chào, <span id="username">Bạn</span>! 🎮</div>
    
    <div id="game-container">
        <canvas id="birdCanvas" width="320" height="480"></canvas>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        const canvas = document.getElementById('birdCanvas');
        const ctx = canvas.getContext('2d');

        // Tạo hình ảnh chú chim SVG
        const birdImg = new Image();
        birdImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 30"><ellipse cx="20" cy="15" rx="18" ry="13" fill="%23f7d51d" stroke="%23000" stroke-width="2"/><ellipse cx="12" cy="17" rx="7" ry="5" fill="%23fff" stroke="%23000" stroke-width="1.5"/><circle cx="28" cy="10" r="5" fill="%23fff" stroke="%23000" stroke-width="1.5"/><circle cx="29" cy="10" r="2" fill="%23000"/><path d="M 32 14 Q 40 16 33 20 Z" fill="%23e74c3c" stroke="%23000" stroke-width="1.5"/></svg>';

        // Biến môi trường game (Đã tinh chỉnh cho tốc độ chậm hơn)
        let birdX = 50;
        let birdY = 200;
        let birdRadius = 14;
        let gravity = 0.22;       // Giảm trọng lực giúp chim rơi chậm hơn
        let velocity = 0;
        let jump = -4.8;          // Nhảy êm hơn
        let score = 0;
        let gameOver = false;

        let pipes = [];
        let pipeWidth = 52;
        let pipeGap = 130;         // Khoảng trống rộng hơn để dễ qua
        let pipeSpeed = 1.6;      // Tốc độ di chuyển cột chậm hơn hẳn

        function createPipe() {
            let topHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 120)) + 40;
            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - pipeGap,
                passed: false
            });
        }

        function handleInput() {
            if (gameOver) {
                resetGame();
            } else {
                velocity = jump;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handleInput();
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput();
        });
        canvas.addEventListener('mousedown', handleInput);

        function resetGame() {
            birdY = 200;
            velocity = 0;
            pipes = [];
            score = 0;
            gameOver = false;
            createPipe();
            loop();
        }

        function update() {
            if (gameOver) return;

            velocity += gravity;
            birdY += velocity;

            // Kiểm tra va chạm sàn/trần
            if (birdY + birdRadius >= canvas.height - 30 || birdY - birdRadius <= 0) {
                gameOver = true;
            }

            // Quản lý cột
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 180) {
                createPipe();
            }

            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];
                p.x -= pipeSpeed;

                // Va chạm cột
                if (
                    birdX + birdRadius > p.x && 
                    birdX - birdRadius < p.x + pipeWidth && 
                    (birdY - birdRadius < p.top || birdY + birdRadius > canvas.height - p.bottom)
                ) {
                    gameOver = true;
                }

                // Cộng điểm
                if (!p.passed && p.x + pipeWidth < birdX) {
                    p.passed = true;
                    score++;
                }
            }

            // Xóa cột đã qua
            if (pipes.length > 0 && pipes[0].x < -pipeWidth) {
                pipes.shift();
            }
        }

        function drawBackground() {
            // Nền trời
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Mây trang trí
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            ctx.beginPath();
            ctx.arc(60, 80, 20, 0, Math.PI * 2);
            ctx.arc(80, 70, 25, 0, Math.PI * 2);
            ctx.arc(100, 80, 20, 0, Math.PI * 2);
            ctx.fill();

            // Đất cỏ phía dưới
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 8);
        }

        function draw() {
            drawBackground();

            // Vẽ các cột ống nước
            for (let i = 0; i < pipes.length; i++) {
                let p = pipes[i];

                // Cột trên
                ctx.fillStyle = "#73bf2e";
                ctx.fillRect(p.x, 0, pipeWidth, p.top);
                ctx.strokeStyle = "#53801b";
                ctx.lineWidth = 3;
                ctx.strokeRect(p.x, 0, pipeWidth, p.top);

                // Cột dưới
                ctx.fillRect(p.x, canvas.height - p.bottom, pipeWidth, p.bottom);
                ctx.strokeRect(p.x, canvas.height - p.bottom, pipeWidth, p.bottom);
            }

            // Vẽ con chim
            ctx.save();
            ctx.translate(birdX, birdY);
            let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, velocity * 0.08));
            ctx.rotate(angle);
            ctx.drawImage(birdImg, -20, -15, 36, 28);
            ctx.restore();

            // Hiển thị Điểm số
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 3;
            ctx.font = "bold 28px sans-serif";
            ctx.strokeText("Điểm: " + score, 15, 38);
            ctx.fillText("Điểm: " + score, 15, 38);

            // Màn hình Game Over
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);

                ctx.font = "16px sans-serif";
                ctx.fillText("Chạm để chơi lại", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop);
            }
        }

        createPipe();
        loop();
    </script>
</body>
</html>
